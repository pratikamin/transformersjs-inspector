<!doctype html>
<meta charset="utf-8">
<title>spike: intercept transformers.js via ORT symbol hook</title>
<style>
  body { font: 13px/1.4 ui-monospace, monospace; margin: 16px; }
  #log { white-space: pre-wrap; background: #111; color: #ddd; padding: 12px; border-radius: 6px; }
  h1 { font-size: 16px; }
</style>
<h1>Spike A: zero-touch interception via <code>globalThis[Symbol.for('onnxruntime')]</code></h1>
<p>Question: can a preload script wrap ONNX Runtime <em>before</em> Transformers.js loads, so that an unmodified pipeline call is observed at the session.run boundary?</p>
<div id="log">booting…</div>

<!-- 1. PRELOAD: this is what the inspector library would ship. Must run before transformers.js evaluates. -->
<script type="module">
  const logEl = document.getElementById('log');
  const log = (...a) => { logEl.textContent += '\n' + a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' '); };
  window.__log = log;
  logEl.textContent = '';

  const ORT_VERSION = '1.26.0-dev.20260416-b7804b056c'; // pinned to what @huggingface/transformers@4.2.0 bundles
  const t0 = performance.now();
  const ort = await import(`https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VERSION}/dist/ort.webgpu.bundle.min.mjs`);
  log(`[preload] loaded onnxruntime-web ${ort.env.versions?.web ?? '?'} in ${(performance.now()-t0).toFixed(0)}ms`);

  const events = [];
  window.__inspectorEvents = events;

  const summarize = (t) => ({
    type: t.type, dims: t.dims, location: t.location,
    size: t.dims.reduce((a,b)=>a*b,1),
    head: t.location === 'cpu' ? Array.from(t.data.slice(0, 8), v => typeof v === 'bigint' ? Number(v) : +v.toFixed?.(4) || v) : '(gpu)'
  });

  const RealSession = ort.InferenceSession;
  const wrappedCreate = async (...args) => {
    const s = await RealSession.create(...args);
    const realRun = s.run.bind(s);
    s.run = async (feeds, ...rest) => {
      const id = events.length;
      const inputs = Object.fromEntries(Object.entries(feeds).map(([k,v]) => [k, summarize(v)]));
      const start = performance.now();
      log(`[run #${id}] inputs`, inputs);
      const out = await realRun(feeds, ...rest);
      const outputs = Object.fromEntries(Object.entries(out).map(([k,v]) => [k, summarize(v)]));
      log(`[run #${id}] outputs (${(performance.now()-start).toFixed(0)}ms)`, outputs);
      events.push({ id, inputs, outputs, ms: performance.now()-start });
      return out;
    };
    log(`[preload] wrapped session: inputs=${JSON.stringify(s.inputNames)} outputs=${JSON.stringify(s.outputNames)}`);
    return s;
  };
  // Hand transformers.js a module-shaped object whose InferenceSession has a wrapped create().
  const shim = { ...ort, InferenceSession: Object.assign(Object.create(RealSession), RealSession, { create: wrappedCreate }) };
  globalThis[Symbol.for('onnxruntime')] = shim;
  log('[preload] installed globalThis[Symbol.for("onnxruntime")]');

  // 2. HOST PAGE: unmodified transformers.js usage, loaded AFTER the preload.
  const tf = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0');
  log(`[host] transformers.js ${tf.env.version} loaded`);
  const progress_callback = (p) => { if (p.status === 'progress' && Math.round(p.progress) % 25 === 0) log(`[host] ${p.file} ${Math.round(p.progress)}%`); };
  let pipe;
  try {
    pipe = await tf.pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', { progress_callback });
  } catch (e) {
    log(`[host] default device FAILED under symbol hook: ${e.message}`);
    log('[host] retrying with device: "auto" (returns the empty supportedDevices list instead of throwing)');
    pipe = await tf.pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', { progress_callback, device: 'auto' });
  }
  log('[host] pipeline ready; model.sessions keys =', Object.keys(pipe.model.sessions));
  const out = await pipe('The inspector sees everything.', { pooling: 'mean', normalize: true });
  log('[host] pipeline output dims', out.dims, 'first values', Array.from(out.data.slice(0,4)).map(v=>+v.toFixed(4)));
  log(`\nRESULT: intercepted ${events.length} session.run call(s) with zero changes to host code.`);
  document.title = events.length ? 'SPIKE PASS' : 'SPIKE FAIL';
</script>
